<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tic‑Tac‑Toe</title>
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrapper">
    <h1>Tic‑Tac‑Toe</h1>

    <p id="status" aria-live="polite" role="status"></p>

    <section id="board" role="grid" aria-label="Tic Tac Toe board">
      <!-- 9 cells generated in HTML for simplicity -->
      <button class="cell" role="gridcell" data-index="0" tabindex="0"></button>
      <button class="cell" role="gridcell" data-index="1" tabindex="0"></button>
      <button class="cell" role="gridcell" data-index="2" tabindex="0"></button>
      <button class="cell" role="gridcell" data-index="3" tabindex="0"></button>
      <button class="cell" role="gridcell" data-index="4" tabindex="0"></button>
      <button class="cell" role="gridcell" data-index="5" tabindex="0"></button>
      <button class="cell" role="gridcell" data-index="6" tabindex="0"></button>
      <button class="cell" role="gridcell" data-index="7" tabindex="0"></button>
      <button class="cell" role="gridcell" data-index="8" tabindex="0"></button>
    </section>

    <button id="reset">Reset</button>
  </main>

  
  <script src="app.js"></script>
</body>
</html>
